# Настоящий Skia вместо подставного холста.
#
# Появилось из-за теста спрайтов: подставной холст рисует приблизительно, и
# щель между пикселями на нём не отличить от щели в самом спрайте. Но режим
# нельзя включать одному классу: тесты одного модуля идут в общей JVM, и
# после класса с натуральной графикой у соседей отваливается нативная
# привязка SQLite — сыпется десяток тестов базы, которые кода не касались.
#
# Поэтому режим один на всех, а не аннотацией на классе.
graphicsMode=NATIVE
