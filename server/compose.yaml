services:
  api:
    build: .
    restart: unless-stopped
    env_file: ${ASHWAKE_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ashwake
      POSTGRES_DB: ashwake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashwake"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    environment:
      ASHWAKE_DOMAIN: ${ASHWAKE_DOMAIN:?set ASHWAKE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]

networks:
  backend:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
