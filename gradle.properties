# Собирать нужно в UTF-8 локали: LANG=C.UTF-8 или любая другая с UTF-8.
#
# Имена тестов в проекте русские, поэтому русскими получаются и имена файлов
# классов, которые пишет компилятор. Кодировку имён файлов JVM берёт из
# локали ОС (sun.jnu.encoding) и переопределить её ключом -D нельзя — в
# локали POSIX сборка падает на «Malformed input or input contains unmappable
# characters», по которой причину не угадать. Это про локаль, а не про код.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Room: схема экспортируется в app/schemas — нужна для ревью миграций
ksp.incremental=true
