name: Публикация APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ashwake ${GITHUB_REF_NAME#v}" \
            --generate-notes
