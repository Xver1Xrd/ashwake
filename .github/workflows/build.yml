name: Сборка и тесты

# Проверяем каждый push и каждый pull request. Ветка не важна: чинить
# сломанное лучше там, где сломали, а не на слиянии.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Имена тестов в проекте русские, поэтому русскими получаются и имена
      # файлов классов, которые пишет компилятор. Кодировку имён файлов JVM
      # берёт из локали ОС, и ключом -D её не переопределить: без UTF-8
      # сборка падает с «unmappable characters», по которой причину не угадать.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Сборка
        run: ./gradlew assembleDebug --stacktrace

      # Отчёт нужен именно при падении: по одной строке «tests failed»
      # причину не найти, а лезть за ней в CI руками — лишний круг
      - name: Отчёт о тестах
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
